<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Осколки — карта памяти</title>
<meta name="theme-color" content="#131519">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!-- iOS не читает манифест: без этих трёх строк «на экран Домой» даёт вкладку
     Safari с адресной строкой, а не отдельное приложение. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Осколки">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="strip">
    <div class="brand"><span class="gem"></span><b>SHARDS</b></div>
    <nav id="tabs" style="display:flex;align-items:stretch">
      <span class="tab" data-r="graph">ГРАФ</span>
      <span class="tab" data-r="cards">КАРТОТЕКА</span>
      <span class="tab" data-r="search">ПОИСК</span>
      <span class="tab" data-r="ask">СПРОСИТЬ</span>
    </nav>
    <div class="info" id="top-count"></div>
    <div class="info" id="top-mode" style="color:#e8b84b"></div>
    <div class="info" id="top-queue" style="color:#e8b84b" title="записи, набранные без связи — уйдут в вальт сами" hidden></div>
    <div class="sp"></div>
    <button class="btn-amber" id="btn-capture">＋ МЫСЛЬ [N]</button>
    <div class="tab" id="btn-new" title="создать заметку из шаблона вальта">＋ ЗАМЕТКА [C]</div>
    <div class="tab" id="btn-install" title="поставить как приложение — своя иконка, своё окно, работает офлайн" hidden>⤓ УСТАНОВИТЬ</div>
    <div class="ws dead" id="ws"><i></i><span id="ws-label">…</span></div>
    <div class="tab" id="btn-conn" title="сменить сервер или секрет">⚙ СЕРВЕР</div>
  </header>
  <main id="view"></main>
  <footer class="bar">
    <span id="bar-hints"></span>
    <span style="color:var(--dim)">CTRL+K — КУДА УГОДНО</span>
    <span class="sp"></span>
    <span id="bar-right">ОСКОЛКИ · КАРТА ПАМЯТИ</span>
  </footer>
</div>
<div id="capture"></div>
<div id="modal"></div>
<div id="palette"></div>
<div id="toasts"></div>
<script type="module" src="js/main.js"></script>
<script>
// Установка. Браузер сам решает, когда предложить, — ловим момент и показываем
// свою кнопку вместо системной подсказки, которую легко проглядеть.
addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  const btn = document.getElementById('btn-install');
  btn.hidden = false;
  btn.addEventListener('click', async () => {
    btn.hidden = true;
    e.prompt();
    await e.userChoice;
  }, { once: true });
});
addEventListener('appinstalled', () => { document.getElementById('btn-install').hidden = true; });

// service worker — только в реальном окружении приложения
if ('serviceWorker' in navigator && /(^|\.)github\.io$|^localhost$|^127\./.test(location.hostname)) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      // Тихое автообновление: новый воркер берёт управление → перезагрузка.
      // Но не любой ценой — перезагрузка посреди работы стирает набранное.
      // Запрещено, пока открыт редактор или окно мысли, пока не разобран
      // пришедший «поделиться», и в первые секунды после запуска: приложение,
      // открытое по ярлыку, как раз в этот момент показывает окно мысли.
      const started = Date.now();
      const busy = () => document.querySelector('.editor')
        || document.getElementById('capture').classList.contains('open')
        || document.getElementById('modal').classList.contains('open')
        || sessionStorage.getItem('shards.pending-share')
        || Date.now() - started < 8000;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        const tick = () => { if (busy()) setTimeout(tick, 5000); else location.reload(); };
        tick();
      });
      setInterval(() => reg.update().catch(() => {}), 15 * 60 * 1000);
    }).catch(() => {});
  });
}
</script>
</body>
</html>
