<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Осколки</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#07090F">
<!--
  Осколки — приложение поверх второго мозга. Один файл, живёт в вальте
  (_машина/осколки.html), git разносит его на все машины, открывается двойным кликом.

  Данные не лежат внутри: всё приезжает через vault-mcp (Cloudflare Worker) с
  Bearer-секретом, который вводится один раз на устройство и хранится в localStorage.
  Живая синхронизация: GitHub-вебхук на push → Durable Object → WebSocket сюда.
-->
<style>
  :root {
    --void: #07090F; --panel: rgba(16,20,30,.82); --panel-line: rgba(150,165,200,.14);
    --text: #E9EAF2; --dim: #9BA3B8; --faint: #5E6577;
    --accent: #7FA0FF; --ok: #4FBF7F; --warn: #EFC454; --err: #F07E58;
    --fresh: #63E0A2; --aging: #EFC454; --stale: #F07E58; --cold: #8D7FC4;
    --halo: lighter;
    --display: Georgia, 'Iowan Old Style', serif;
    --sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  }
  @media (prefers-color-scheme: light) { :root {
    --void: #F1EDE2; --panel: rgba(252,250,244,.88); --panel-line: rgba(45,55,90,.16);
    --text: #1C2233; --dim: #4E566E; --faint: #8B90A2;
    --accent: #2D4EA8; --ok: #1E7A50; --warn: #9A7115; --err: #B0492B;
    --fresh: #1E7A50; --aging: #9A7115; --stale: #B0492B; --cold: #5F5187;
    --halo: normal;
  }}
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--void); color: var(--text); font-family: var(--sans); overflow: hidden; }
  #stage { position: fixed; inset: 0; cursor: grab; touch-action: none; }
  #stage.dragging { cursor: grabbing; }
  .glass { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px;
           backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2); }
  button { font-family: inherit; }

  header { position: fixed; top: 1rem; left: 1rem; right: 1rem; z-index: 6;
           display: flex; align-items: center; flex-wrap: wrap; gap: .5rem 1rem;
           padding: .55rem .9rem .55rem 1.1rem; pointer-events: none; }
  header > * { pointer-events: auto; }
  .wordmark { display: flex; align-items: baseline; gap: .5rem; white-space: nowrap; }
  .wordmark .mark { color: var(--accent); }
  .wordmark .name { font-family: var(--display); font-style: italic; font-size: 1.3rem; }
  #conn { display: flex; align-items: center; gap: .4rem; font-size: .72rem; color: var(--dim); white-space: nowrap; }
  #conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  #conn.live .dot { background: var(--ok); animation: pulse 2.4s infinite; }
  #conn.err .dot { background: var(--err); }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { #conn .dot { animation: none; } }
  #q { flex: 1; min-width: 9rem; max-width: 26rem; margin-left: auto; background: transparent;
       border: 0; border-bottom: 1px solid var(--panel-line); padding: .45rem .2rem;
       color: var(--text); font: inherit; font-size: .88rem; }
  #q:focus { outline: none; border-bottom-color: var(--accent); }
  .hbtn { background: none; border: 1px solid var(--panel-line); border-radius: 8px; color: var(--dim);
          padding: .35rem .7rem; font-size: .78rem; cursor: pointer; white-space: nowrap; }
  .hbtn:hover { color: var(--text); border-color: var(--accent); }

  #dock { position: fixed; left: 1rem; top: 5.6rem; z-index: 5; width: 15rem;
          max-height: calc(100dvh - 7.2rem); overflow-y: auto; padding: 1rem;
          display: flex; flex-direction: column; gap: 1rem; scrollbar-width: thin; }
  .lbl { font-size: .64rem; letter-spacing: .13em; text-transform: uppercase; color: var(--faint);
         margin-bottom: .45rem; font-weight: 600; }
  .seg { display: flex; gap: 4px; background: rgba(128,140,170,.1); border-radius: 9px; padding: 3px; }
  .seg button { flex: 1; background: none; border: 0; border-radius: 7px; padding: .36rem .15rem;
                color: var(--dim); font-size: .73rem; cursor: pointer; white-space: nowrap; }
  .seg button.on { background: var(--accent); color: var(--void); font-weight: 700; }
  .chip-row { display: flex; flex-wrap: wrap; gap: .3rem; }
  .zchip { display: inline-flex; align-items: center; gap: .38rem; background: none;
           border: 1px solid var(--panel-line); border-radius: 999px; padding: .22rem .6rem;
           color: var(--dim); font-size: .72rem; cursor: pointer; }
  .zchip .sw { width: 7px; height: 7px; border-radius: 50%; }
  .zchip.off { opacity: .35; }
  .tgl { display: flex; align-items: center; justify-content: space-between; font-size: .8rem; color: var(--dim); }
  .tgl input { accent-color: var(--accent); }

  #panel { position: fixed; right: 1rem; top: 5.6rem; bottom: 1rem; z-index: 7; width: min(34rem, calc(100vw - 2rem));
           display: none; flex-direction: column; overflow: hidden; }
  #panel.show { display: flex; }
  #panel .phead { display: flex; align-items: baseline; gap: .8rem; padding: 1rem 1.2rem .6rem; }
  #panel .phead h2 { font-family: var(--display); font-style: italic; font-weight: 400; font-size: 1.2rem;
                     margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #panel .phead .x { background: none; border: 0; color: var(--faint); font-size: 1.05rem; cursor: pointer; }
  #panel .pmeta { padding: 0 1.2rem .6rem; font-family: var(--mono); font-size: .68rem; color: var(--faint); }
  #panel .pbody { overflow-y: auto; padding: 0 1.2rem 1.2rem; scrollbar-width: thin; flex: 1; }

  .sec { border: 1px solid var(--panel-line); border-radius: 10px; margin-bottom: .7rem; overflow: hidden; }
  .sec .shead { display: flex; justify-content: space-between; align-items: center; gap: .6rem;
                padding: .5rem .8rem; background: rgba(128,140,170,.08); font-size: .82rem; font-weight: 600; }
  .sec .shead .ebtn { background: none; border: 0; color: var(--accent); font-size: .72rem; cursor: pointer; }
  .sec .stext { padding: .6rem .8rem; font-size: .86rem; line-height: 1.6; white-space: pre-wrap;
                overflow-wrap: anywhere; }
  .sec .stext a { color: var(--accent); text-decoration: none; cursor: pointer; }
  .sec .stext a:hover { text-decoration: underline; }
  .sec textarea { width: 100%; min-height: 9rem; background: rgba(128,140,170,.08); color: var(--text);
                  border: 0; padding: .7rem .8rem; font: .84rem/1.55 var(--mono); resize: vertical; }
  .sec textarea:focus { outline: 1px solid var(--accent); }
  .sec .sbar { display: flex; gap: .5rem; justify-content: flex-end; padding: .5rem .8rem; }
  .btn { background: var(--accent); color: var(--void); border: 0; border-radius: 8px;
         padding: .45rem .95rem; font-size: .8rem; font-weight: 700; cursor: pointer; }
  .btn.ghost { background: rgba(128,140,170,.14); color: var(--text); font-weight: 500; }
  .btn[disabled] { opacity: .5; cursor: wait; }

  .hit { border: 1px solid var(--panel-line); border-radius: 10px; padding: .6rem .8rem;
         margin-bottom: .6rem; cursor: pointer; }
  .hit:hover { border-color: var(--accent); }
  .hit .hp { font-size: .78rem; font-weight: 600; color: var(--accent); overflow-wrap: anywhere; }
  .hit .hh { font-size: .68rem; color: var(--faint); margin: .15rem 0; }
  .hit .ht { font-size: .8rem; color: var(--dim); line-height: 1.5; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); gap: .55rem; }
  .card { border: 1px solid var(--panel-line); border-left-width: 4px; border-radius: 10px;
          padding: .6rem .75rem; cursor: pointer; min-width: 0; }
  .card:hover { border-color: var(--accent); }
  .card .t { font-size: .82rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .m { font-family: var(--mono); font-size: .66rem; color: var(--faint); margin-top: .3rem; }

  #setup { position: fixed; inset: 0; z-index: 20; display: none; place-items: center;
           background: color-mix(in srgb, var(--void) 72%, transparent); backdrop-filter: blur(6px); }
  #setup.show { display: grid; }
  #setup .box { width: min(26rem, calc(100vw - 2rem)); padding: 1.6rem; }
  #setup h2 { font-family: var(--display); font-style: italic; font-weight: 400; margin: 0 0 .3rem; }
  #setup p { font-size: .82rem; color: var(--dim); margin: 0 0 1.1rem; line-height: 1.55; }
  #setup label { display: block; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase;
                 color: var(--faint); margin: .8rem 0 .3rem; }
  #setup input { width: 100%; background: rgba(128,140,170,.1); border: 1px solid var(--panel-line);
                 border-radius: 8px; padding: .55rem .75rem; color: var(--text); font: inherit; font-size: .85rem; }
  #setup input:focus { outline: none; border-color: var(--accent); }
  #setup .err { color: var(--err); font-size: .78rem; min-height: 1.2rem; margin-top: .6rem; }
  #setup .row { display: flex; justify-content: flex-end; gap: .6rem; margin-top: .6rem; }

  #tip { position: fixed; z-index: 8; pointer-events: none; display: none; padding: .35rem .6rem;
         font-size: .75rem; border-radius: 8px; background: var(--panel);
         border: 1px solid var(--panel-line); backdrop-filter: blur(10px); max-width: 17rem; }
  #tip .z { color: var(--faint); font-size: .65rem; }
  #toast { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%) translateY(200%);
           z-index: 30; padding: .6rem 1.1rem; font-size: .82rem; border-radius: 10px;
           background: var(--panel); border: 1px solid var(--panel-line); backdrop-filter: blur(10px);
           transition: transform .25s; max-width: 90vw; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #legend { position: fixed; left: 1rem; bottom: 1rem; z-index: 4; padding: .5rem .8rem;
            font-size: .68rem; color: var(--faint); display: flex; gap: .8rem; }
  #legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: .3rem; }

  @media (max-width: 760px) {
    #dock { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 34dvh;
            border-radius: 14px 14px 0 0; flex-direction: row; flex-wrap: wrap; align-items: flex-start; }
    #dock > div { min-width: 9rem; flex: 1; }
    #panel { left: .6rem; right: .6rem; width: auto; top: 4.6rem; bottom: 35dvh; }
    #legend { display: none; }
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<header class="glass">
  <div class="wordmark"><span class="mark">◈</span><span class="name">осколки</span></div>
  <div id="conn"><span class="dot"></span><span id="connTxt">не подключено</span></div>
  <input id="q" type="search" placeholder="Спросить память… (Enter)" aria-label="Поиск">
  <button class="hbtn" id="btnCatalog">Картотека</button>
  <button class="hbtn" id="btnSetup" title="Настройки">⚙</button>
</header>

<div id="dock" class="glass">
  <div><div class="lbl">Вид</div>
    <div class="seg" id="segView"><button data-v="3d" class="on">Объём</button><button data-v="2d">Плоскость</button></div></div>
  <div><div class="lbl">Раскладка</div>
    <div class="seg" id="segMode"><button data-v="orbit" class="on">Орбита</button><button data-v="force">Сила</button><button data-v="rings">Кольца</button></div></div>
  <div><div class="lbl">Цвет</div>
    <div class="seg" id="segColor"><button data-v="zone" class="on">Зона</button><button data-v="fresh">Свежесть</button><button data-v="deg">Связность</button></div></div>
  <div><div class="lbl">Размер</div>
    <div class="seg" id="segSize"><button data-v="bytes" class="on">Объём</button><button data-v="deg">Связи</button><button data-v="commits">Правки</button></div></div>
  <div><div class="lbl">Зоны</div><div class="chip-row" id="zones"></div></div>
  <div><div class="lbl">Отображение</div>
    <label class="tgl">Связи <input type="checkbox" id="tEdges" checked></label>
    <label class="tgl">Подписи <input type="checkbox" id="tLabels" checked></label>
    <label class="tgl">Вращение <input type="checkbox" id="tSpin" checked></label></div>
  <div id="stats" style="font-family:var(--mono);font-size:.68rem;color:var(--faint)"></div>
</div>

<aside id="panel" class="glass">
  <div class="phead"><h2 id="pTitle"></h2><button class="x" id="pClose" aria-label="Закрыть">✕</button></div>
  <div class="pmeta" id="pMeta"></div>
  <div class="pbody" id="pBody"></div>
</aside>

<div id="setup" >
  <div class="box glass">
    <h2>Подключение к памяти</h2>
    <p>Секрет — тот же, что у коннектора vault-mcp. Хранится только в этом браузере, вводится один раз на устройство.</p>
    <label for="sUrl">Адрес воркера</label>
    <input id="sUrl" spellcheck="false" value="https://vault-mcp.vault-78edd5.workers.dev/mcp">
    <label for="sSecret">Секрет</label>
    <input id="sSecret" type="password" autocomplete="off">
    <div class="err" id="sErr"></div>
    <div class="row"><button class="btn" id="sGo">Проверить и войти</button></div>
  </div>
</div>

<div id="tip"></div>
<div id="legend" class="glass"><span><i style="background:var(--fresh)"></i>неделя</span><span><i style="background:var(--aging)"></i>две</span><span><i style="background:var(--stale)"></i>три</span><span><i style="background:var(--cold)"></i>старше</span></div>
<div id="toast" role="status"></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(toast._h); toast._h = setTimeout(() => t.classList.remove("show"), 3200); };
const mulberry = (a) => () => (a = (a + 0x6D2B79F5) | 0, ((Math.imul(a ^ (a >>> 15), 1 | a) + a) >>> 0) / 4294967296);

/* ── связь с воркером ── */
const LS = { url: "осколки.url", secret: "осколки.secret" };
let cfg = { url: localStorage.getItem(LS.url) || "", secret: localStorage.getItem(LS.secret) || "" };

async function rpc(method, params) {
  const r = await fetch(cfg.url, {
    method: "POST",
    headers: { Authorization: "Bearer " + cfg.secret, "Content-Type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }),
  });
  if (r.status === 404) throw new Error("Воркер не принял: адрес или секрет неверны");
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  if (j.error) throw new Error(j.error.message);
  return j.result;
}
async function tool(name, args) {
  const res = await rpc("tools/call", { name, arguments: args });
  const t = res.content?.[0]?.text ?? "";
  if (res.isError) throw new Error(t.slice(0, 200));
  return t;
}

/* ── данные ── */
let nodes = [], edges = [], neighbors = new Map(), byPath = new Map(), byBase = new Map();
let zonesAll = [], lastLoad = 0;

function zoneOf(p) {
  const z = [
    ["Учёба/Лог сессий/", "Лог учёбы"], ["Учёба/", "Учёба"],
    ["brain/log", "Лог сессий"], ["brain/decisions", "Решения"], ["brain/", "Ядро"],
    ["people/", "Люди"], ["projects/", "Проекты"], ["areas/", "Области"],
    ["resources/", "Материалы"], ["daily/", "Дневник"],
    ["_tools/queue", "Очередь ПК"], ["_tools/", "Инструменты"], ["archive/", "Архив"],
  ];
  for (const [pre, name] of z) if (p.startsWith(pre)) return name;
  return "Корень";
}
const base = (p) => p.split("/").pop().replace(/\.md$/, "");

async function loadAll() {
  $("#connTxt").textContent = "загрузка…";
  const listing = await tool("vault_list", { path: "_машина/индекс" });
  const shardNames = [...listing.matchAll(/индекс\/(\d+\.json)/g)].map((m) => m[1]);
  const [metaRaw, ...shardsRaw] = await Promise.all([
    tool("vault_read", { path: "_машина/индекс/meta.json" }).catch(() => "{}"),
    ...shardNames.map((n) => tool("vault_read", { path: `_машина/индекс/${n}` })),
  ]);
  const meta = JSON.parse(metaRaw);
  const chunks = shardsRaw.flatMap((s) => JSON.parse(s));

  const texts = new Map(); // путь → полный текст из кусков (для wikilinks)
  for (const c of chunks) texts.set(c.p, (texts.get(c.p) || "") + "\n" + c.t);

  nodes = []; byPath.clear(); byBase.clear();
  const paths = [...new Set(chunks.map((c) => c.p))].sort();
  const now = Date.now();
  paths.forEach((p, i) => {
    const m = meta[p] || {};
    const ageOf = (iso) => iso ? Math.max(0, Math.floor((now - Date.parse(iso)) / 86400000)) : null;
    const n = { id: i, path: p, label: base(p), zone: zoneOf(p),
      age: ageOf(m.h || m.u), size: m.b || 0, commits: m.c || 0,
      deg: 0, x: 0, y: 0, z: 0, tx: 0, ty: 0, tz: 0, fx: 0, fy: 0, fz: 0, vx: 0, vy: 0 };
    nodes.push(n); byPath.set(p, n);
    const b = n.label.toLowerCase();
    if (!byBase.has(b)) byBase.set(b, n);
  });

  // Настоящие связи: wikilinks из текста заметок. Резолв по короткому имени —
  // так же, как это делает Obsidian в этом вальте (app.json пуст).
  edges = []; neighbors = new Map(nodes.map((n) => [n.id, []]));
  const seen = new Set();
  for (const [p, text] of texts) {
    const a = byPath.get(p);
    for (const m of text.matchAll(/\[\[([^\]|#]+)/g)) {
      const b = byBase.get(m[1].trim().toLowerCase());
      if (!b || b.id === a.id) continue;
      const k = a.id < b.id ? a.id * 10000 + b.id : b.id * 10000 + a.id;
      if (seen.has(k)) continue;
      seen.add(k);
      edges.push([a.id, b.id]);
      a.deg++; b.deg++;
      neighbors.get(a.id).push(b.id); neighbors.get(b.id).push(a.id);
    }
  }

  zonesAll = [...new Set(nodes.map((n) => n.zone))];
  state.zoneOn = new Set(zonesAll);
  buildZoneChips();
  $("#stats").textContent = `${nodes.length} осколков · ${edges.length} связей · синх ${new Date().toLocaleTimeString("ru", { hour: "2-digit", minute: "2-digit" })}`;
  lastLoad = now;
  relayout(true);
}

/* ── живая синхронизация ── */
let ws = null, wsTimer = null, reloadTimer = null;
function setConn(cls, txt) { const c = $("#conn"); c.className = cls; $("#connTxt").textContent = txt; }
async function connectWs() {
  clearTimeout(wsTimer);
  try {
    const r = await fetch(cfg.url.replace(/\/mcp$/, "/ticket"), { method: "POST", headers: { Authorization: "Bearer " + cfg.secret } });
    if (!r.ok) throw new Error("ticket " + r.status);
    const { ts, t } = await r.json();
    const wsUrl = cfg.url.replace(/^http/, "ws").replace(/\/mcp$/, `/ws?ts=${ts}&t=${t}`);
    ws = new WebSocket(wsUrl);
    ws.onopen = () => setConn("live", "живая синхронизация");
    ws.onmessage = (e) => {
      if (e.data === "pong") return;
      let msg; try { msg = JSON.parse(e.data); } catch { return; }
      if (msg.type !== "push") return;
      setConn("live", `коммит ${msg.sha}`);
      toast(`Вальт обновился: ${msg.message || msg.sha}`);
      clearTimeout(reloadTimer);
      // Индекс коммитится Action'ом следом за содержимым — ждём его толчка,
      // а по обычному пушу перечитываем с запасом в несколько секунд.
      reloadTimer = setTimeout(() => loadAll().catch(() => {}), msg.indexTouched ? 800 : 5000);
      if (openPath && msg.paths?.includes(openPath)) openFile(openPath);
    };
    ws.onclose = () => { setConn("", "переподключение…"); wsTimer = setTimeout(connectWs, 6000); };
    ws.onerror = () => ws.close();
    setInterval(() => { try { ws?.readyState === 1 && ws.send("ping"); } catch {} }, 30000);
  } catch {
    setConn("err", "без живой связи");
    wsTimer = setTimeout(connectWs, 30000);
  }
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && Date.now() - lastLoad > 120000 && cfg.secret) loadAll().catch(() => {});
});

/* ── панель: файл ── */
let openPath = null;
const panel = $("#panel"), pBody = $("#pBody");
$("#pClose").addEventListener("click", () => { panel.classList.remove("show"); openPath = null; state.sel = -1; });

function linkify(text) {
  return esc(text).replace(/\[\[([^\]|#]+)(?:[|#][^\]]*)?\]\]/g, (_, t) => {
    const n = byBase.get(t.trim().toLowerCase());
    return n ? `<a data-open="${esc(n.path)}">${esc(t)}</a>` : esc(`[[${t}]]`);
  });
}
function splitSections(text) {
  let body = text, fm = null;
  if (body.startsWith("---")) {
    const e = body.indexOf("\n---", 3);
    if (e !== -1) { fm = body.slice(0, e + 4); body = body.slice(e + 4); }
  }

    x2.globalCompositeOperation = darkNow() ? "lighter" : "source-over";
    const hs = r * (darkNow() ? 9 : 7);
    x2.drawImage(halo(col), pr.sx - hs / 2, pr.sy - hs / 2, hs, hs);
    x2.globalCompositeOperation = "source-over";
    x2.globalAlpha = al;
    x2.fillStyle = col;
    x2.beginPath(); x2.arc(pr.sx, pr.sy, r, 0, 7); x2.fill();
    if (darkNow() && r > 2.2 && !dimmed) {
      x2.globalAlpha = al * .85;
      x2.fillStyle = "#fff";
      x2.beginPath(); x2.arc(pr.sx - r * .18, pr.sy - r * .18, r * .34, 0, 7); x2.fill();
    }
    if (i === state.sel || i === state.hover) {
      x2.globalAlpha = 1;
      x2.strokeStyle = css.text; x2.lineWidth = 1.4;
      x2.beginPath(); x2.arc(pr.sx, pr.sy, r + 3.5, 0, 7); x2.stroke();
    }
  }
  x2.globalAlpha = 1;

  // Имена созвездий — курсивом с засечками у центроида каждой зоны.
  if (state.labels && state.intro > .6 && !nbSet) {
    x2.textAlign = "center"; x2.textBaseline = "middle";
    x2.font = "italic 15px Georgia, serif";
    for (const z of zonesAll) {
      if (!state.zoneOn.has(z)) continue;
      let sx = 0, sy = 0, m = 0;
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].zone !== z || !visible(nodes[i])) continue;
        sx += proj[i].sx; sy += proj[i].sy; m++;
      }
      if (m < 3) continue;
      x2.globalAlpha = .5;
      x2.lineWidth = 4; x2.lineJoin = "round"; x2.strokeStyle = css.void;
      x2.strokeText(z, sx / m, sy / m);
      x2.fillStyle = css.dim;
      x2.fillText(z, sx / m, sy / m);
    }
    x2.globalAlpha = 1;
    x2.textAlign = "left";
  }

  // Подписи осколков.
  if (state.labels) {
    x2.font = "11px " + getComputedStyle(document.body).fontFamily;
    x2.textBaseline = "middle"; x2.lineWidth = 3; x2.lineJoin = "round"; x2.strokeStyle = css.void;
    const labeled = order.filter((i) => visible(nodes[i]) && (nodeR(nodes[i]) > 5.6 || i === state.sel || (nbSet && nbSet.has(i))));
    for (const i of labeled.slice(-30)) {
      const pr = proj[i];
      if (nbSet && !nbSet.has(i)) continue;
      const tx = pr.sx + nodeR(nodes[i]) * pr.p * state.zoom + 6;
      const lb = nodes[i].label.slice(0, 26);
      x2.globalAlpha = Math.max(.35, Math.min(1, pr.p - .3)) * state.intro;
      x2.strokeText(lb, tx, pr.sy);
      x2.fillStyle = css.text; x2.fillText(lb, tx, pr.sy);
    }
    x2.globalAlpha = 1;
  }
  if (vignette) x2.drawImage(vignette, 0, 0, W, H);
  requestAnimationFrame(frame);
}

const drag = { on: false, px: 0, py: 0, moved: 0 };
cv.addEventListener("pointerdown", (e) => { drag.on = true; drag.moved = 0; drag.px = e.clientX; drag.py = e.clientY; cv.classList.add("dragging"); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", (e) => {
  if (drag.on) {
    const dx = e.clientX - drag.px, dy = e.clientY - drag.py;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    drag.px = e.clientX; drag.py = e.clientY;
    if (!flat()) { state.rotY += dx * .004; state.rotX = Math.max(-1.2, Math.min(1.2, state.rotX + dy * .004)); }
    else for (const n of nodes) { n.tx += dx / state.zoom; n.ty += dy / state.zoom; n.fx += dx / state.zoom; n.fy += dy / state.zoom; }
  } else {
    const i = pick(e.clientX, e.clientY);
    state.hover = i;
    const tip = $("#tip");
    if (i !== -1) {
      const n = nodes[i];
      tip.innerHTML = `<b>${esc(n.label)}</b><div class="z">${esc(n.zone)} · ${n.age ?? "—"} дн. · ${n.deg} связей</div>`;
      tip.style.display = "block";
      tip.style.left = Math.min(e.clientX + 14, innerWidth - 270) + "px";
      tip.style.top = Math.min(e.clientY + 14, innerHeight - 62) + "px";
    } else tip.style.display = "none";
  }
});
cv.addEventListener("pointerup", (e) => {
  drag.on = false; cv.classList.remove("dragging");
  if (drag.moved < 6) {
    const i = pick(e.clientX, e.clientY);
    if (i !== -1) openFile(nodes[i].path);
    else { state.sel = -1; }
  }
});
cv.addEventListener("wheel", (e) => { e.preventDefault(); state.zoom = Math.max(.45, Math.min(3, state.zoom * (e.deltaY < 0 ? 1.09 : .92))); }, { passive: false });
function pick(mx, my) {
  let best = -1, bd = 14;
  for (let i = 0; i < nodes.length; i++) {
    if (!visible(nodes[i])) continue;
    const p = project(nodes[i]);
    const d = Math.hypot(p.sx - mx, p.sy - my) - nodeR(nodes[i]) * p.p * state.zoom;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

function seg(id, key, after) {
  const el = $(id);
  el.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    el.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    state[key] = b.dataset.v; after?.();
  }));
}
seg("#segView", "view", relayout);
seg("#segMode", "mode", relayout);
seg("#segColor", "colorBy");
seg("#segSize", "sizeBy");
function buildZoneChips() {
  const el = $("#zones"); el.innerHTML = "";
  zonesAll.forEach((z) => {
    const b = document.createElement("button");
    b.className = "zchip";
    b.innerHTML = `<span class="sw"></span>${esc(z)}`;
    b.querySelector(".sw").style.background = zoneColor(z);
    b.addEventListener("click", () => {
      state.zoneOn.has(z) ? state.zoneOn.delete(z) : state.zoneOn.add(z);
      b.classList.toggle("off", !state.zoneOn.has(z));
    });
    el.appendChild(b);
  });
}
$("#tEdges").addEventListener("change", (e) => state.edges = e.target.checked);
$("#tLabels").addEventListener("change", (e) => state.labels = e.target.checked);
$("#tSpin").addEventListener("change", (e) => state.spin = e.target.checked);
$("#q").addEventListener("input", (e) => state.q = e.target.value.trim().toLowerCase());
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readCss);

/* ── старт ── */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
readCss(); resize();
requestAnimationFrame(frame);
if (cfg.url && cfg.secret) {
  loadAll().then(connectWs).catch((e) => { toast(e.message); setup.classList.add("show"); });
} else {
  setup.classList.add("show");
}
</script>
