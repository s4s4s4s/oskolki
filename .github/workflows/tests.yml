# Проверки перед выкладкой.
#
# Приложение — статика без сборки: пуш в master сразу становится тем, что видит
# человек. Значит единственная защита от того, чтобы выложить сломанное, — эта
# проверка, и она обязана быть быстрой, иначе её начнут обходить.
#
# Тест кругового прогона по настоящему вальту здесь пропускается: вальт лежит в
# приватном репозитории и в этот прогон не выкачивается. Он гоняется локально
# перед пушем — и именно он нашёл поломку записи фронтматтера в 569 файлах.

name: tests

on:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Тесты и сверка поиска
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Тесты
        run: node --test _dev/tests.mjs

      # Ранжирование приложения — порт из воркера. Две реализации расходятся
      # молча, и поиск начинает не находить очевидное; сверка ловит это до
      # выкладки.
      #
      # Шаг больше НЕ глушится. Раньше стояло continue-on-error плюс
      # `|| echo`, и упасть он не мог физически — то есть сверки не было
      # вовсе, была зелёная галочка. Причина глушителей была настоящая:
      # при отсутствии вальта скрипт падал ENOENT неотличимо от расхождения.
      # Теперь это развёл сам parity.mjs — нет вальта, он выходит нулём и
      # печатает ::notice:: о пропуске; код 1 означает только расхождение.
      - name: Сверка ранжирования с воркером
        run: node _dev/parity.mjs
