# Проверки И выкладка — одним конвейером, в таком порядке.
#
# Раньше Pages публиковал master напрямую, событием dynamic, ПАРАЛЛЕЛЬНО этим
# тестам: за двое суток 31 выкладка против 7 прогонов. Тесты бежали после
# выкладки и не могли ничего предотвратить — это был отчёт о вскрытии, а не
# проверка. Теперь выкладка — отдельная работа, зависящая от тестов: красные
# тесты означают, что человек продолжает видеть предыдущую версию.
#
# Тест кругового прогона по настоящему вальту здесь пропускается: вальт лежит в
# приватном репозитории и в этот прогон не выкачивается. Он гоняется локально
# перед пушем — и именно он нашёл поломку записи фронтматтера в 569 файлах.
#
# Идентификаторы работ только латиницей: кириллический id уже ронял workflow
# молча, без строчки в логе.

name: tests

on:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Выкладки не должны обгонять друг друга, но и обрывать начатую нельзя —
# иначе половина выложится, половина нет.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Тесты и сверка поиска
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Тесты
        run: node --test _dev/tests.mjs

      # Ранжирование приложения — порт из воркера. Две реализации расходятся
      # молча, и поиск начинает не находить очевидное; сверка ловит это до
      # выкладки.
      #
      # Шаг больше НЕ глушится. Раньше стояло continue-on-error плюс
      # `|| echo`, и упасть он не мог физически — то есть сверки не было
      # вовсе, была зелёная галочка. Причина глушителей была настоящая:
      # при отсутствии вальта скрипт падал ENOENT неотличимо от расхождения.
      # Теперь это развёл сам parity.mjs — нет вальта, он выходит нулём и
      # печатает ::notice:: о пропуске; код 1 означает только расхождение.
      - name: Сверка ранжирования с воркером
        run: node _dev/parity.mjs

  deploy:
    name: Выкладка на Pages
    # Вот он, гейт: без зелёных тестов эта работа не стартует вовсе.
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Приложение — статика без сборки, поэтому выкладывается репозиторий как
      # есть. В свежем клоне лежит только отслеживаемое: node_modules и dist
      # в .gitignore и сюда не попадают.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
